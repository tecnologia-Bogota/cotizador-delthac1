<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cotizador Seguridad PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7F001B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="pagesize">@page{size:letter;margin:14mm 14mm 16mm}@page cover{margin:0}</style>
<style>
:root{
  --bg:#F3F2F0;--surface:#FFFFFF;--surface2:#F9F8F7;--ink:#1D1B1E;--muted:#6C6769;--line:#E2DEDC;--line2:#EEEBE9;
  --brand:#7F001B;--brand2:#2A2A30;--brand-text:var(--brand);--brand-soft:color-mix(in srgb,var(--brand) 9%,transparent);
  --ok:#1D7A4C;--ok-bg:#E6F3EC;--warn:#9A5B00;--warn-bg:#FBF0DC;--crit:#B42318;--crit-bg:#FBE7E5;--info-bg:#ECEEF2;
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#141316;--surface:#1D1C20;--surface2:#232227;--ink:#ECE9E8;--muted:#A29D9E;--line:#35333A;--line2:#2B2A30;
  --brand-text:color-mix(in srgb,var(--brand) 45%,#ffffff);--brand-soft:color-mix(in srgb,var(--brand) 22%,transparent);
  --ok:#5CC48E;--ok-bg:#15301F;--warn:#E3A948;--warn-bg:#352812;--crit:#F07A6E;--crit-bg:#3A1714;--info-bg:#25262C;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#141316;--surface:#1D1C20;--surface2:#232227;--ink:#ECE9E8;--muted:#A29D9E;--line:#35333A;--line2:#2B2A30;
  --brand-text:color-mix(in srgb,var(--brand) 45%,#ffffff);--brand-soft:color-mix(in srgb,var(--brand) 22%,transparent);
  --ok:#5CC48E;--ok-bg:#15301F;--warn:#E3A948;--warn-bg:#352812;--crit:#F07A6E;--crit-bg:#3A1714;--info-bg:#25262C;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--brand2);color:#EDEBEA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side .brandbox{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px}
.side .logo{background:#fff;border-radius:4px;padding:8px 10px;display:flex;align-items:center;justify-content:center;min-height:48px}
.side .logo img{max-height:40px}
.side .cname{font:600 13px/1.2 var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:#fff}
.side label.sl{font:500 11px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:#A9A6A8}
.side select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:7px 8px;color:#fff}
.side select option{color:#111}
.nav{display:flex;flex-direction:column;padding:10px 8px;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;font:500 15px var(--f-head);letter-spacing:.02em;color:#D8D5D6}
.nav button .k{font:500 11px var(--f-mono);color:#8D898B;width:18px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--brand);color:#fff}
.nav button.on .k{color:rgba(255,255,255,.7)}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.side .foot{margin-top:auto;padding:14px 16px;font-size:11px;color:#8F8B8D;border-top:1px solid rgba(255,255,255,.08)}
/* main */
main{min-width:0;display:flex;flex-direction:column}
.kpis{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:0;align-items:stretch}
.kpi{padding:10px 14px;border-right:1px solid var(--line2);display:flex;flex-direction:column;justify-content:center;min-width:0}
.kpi .l{font:600 11px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 18px/1.15 var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.main .v{color:var(--brand-text)}
.kpis .proj{padding:10px 18px;flex:1 1 200px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.kpis .proj b{font:700 18px/1.1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36ch}
.kpis .proj span{font-size:12px;color:var(--muted)}
.view{padding-block:22px 60px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
h1.vt{font:700 28px/1.1 var(--f-head);letter-spacing:.01em;margin:0;text-wrap:balance}
.vsub{color:var(--muted);margin:4px 0 0;max-width:80ch}
.vhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2)}
.panel>.ph h2{font:700 16px var(--f-head);letter-spacing:.05em;text-transform:uppercase;margin:0}
.panel>.ph .hint{font-size:12px;color:var(--muted)}
.panel>.pb{padding:14px 16px}
.grid{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.cols2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font:600 11.5px var(--f-head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.f.wide{grid-column:1/-1}
.f .help{font-size:11.5px;line-height:1.35;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-text);outline-offset:-1px;background:var(--surface)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:4px;background:var(--surface2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 12px;cursor:pointer;font:600 13.5px var(--f-head);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--brand-text);color:var(--brand-text)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.12);color:#fff}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--crit)}
.btn.danger.arm{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.x{all:unset;cursor:pointer;width:24px;height:24px;display:inline-grid;place-items:center;border-radius:4px;color:var(--muted);font-size:16px}
.x:hover{background:var(--crit-bg);color:var(--crit)}
.x:focus-visible{outline:2px solid var(--brand-text)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font:600 11px var(--f-head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t td input[type=number]{width:92px;padding:4px 6px}
table.t td input.w60{width:64px}
table.t td input[type=text],table.t td select{padding:4px 6px}
table.t td select.sys{min-width:150px}table.t td select.prf{min-width:190px}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:13px}.opt input{margin-top:2px;flex:none}
table.t tr.grp td{background:var(--brand-soft);font:700 13px var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--brand-text);padding:7px 8px}
table.t tr.sub td{font-weight:600;background:var(--surface2)}
table.t tr.tot td{font:700 15px var(--f-head);border-top:2px solid var(--ink)}
table.t tr.dim td{color:var(--muted)}
table.t tr.dim td input{opacity:.6}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12px}
.src{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font:600 11.5px var(--f-head);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.info{background:var(--info-bg);color:var(--muted)}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:12px;margin:1px 2px 1px 0}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font:600 18px var(--f-head)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.tile .l{font:600 11.5px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 24px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.hi{background:var(--brand);border-color:var(--brand);color:#fff}
.tile.hi .l,.tile.hi .s{color:rgba(255,255,255,.75)}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand-text)}
details.prof{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.prof+details.prof{margin-top:8px}
details.prof>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;align-items:center}
details.prof>summary::-webkit-details-marker{display:none}
details.prof>summary .pn{font:700 15px var(--f-head);letter-spacing:.03em}
details.prof>summary .pd{grid-column:1/-1;font-size:12px;color:var(--muted)}
details.prof[open]>summary{border-bottom:1px solid var(--line2)}
details.prof .pbody{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.subh{font:700 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.note{background:var(--surface2);border-left:3px solid var(--brand);padding:10px 12px;font-size:13px;border-radius:0 4px 4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 10px;font:600 12.5px var(--f-head);letter-spacing:.05em;text-transform:uppercase}
.seg button.on{background:var(--brand);color:#fff}
.savebox{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:8px 14px;border-right:1px solid var(--line2)}
.savebox .btn{min-width:118px;justify-content:center}.warnt{color:var(--warn);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#999}.dot.ok{background:#3CCB7F}.dot.warn{background:#F0B429}.dot.crit{background:#F07A6E}
#diskBadge{margin-bottom:6px;color:#D8D5D6;font-size:12px}
.linkbtn{all:unset;cursor:pointer;color:#D8D5D6;font-size:12px}.linkbtn:hover{color:#fff;text-decoration:underline}.linkbtn:focus-visible{outline:2px solid #fff}
.note.ok{border-left-color:var(--ok)}.note.warn{border-left-color:var(--warn)}.note.crit{border-left-color:var(--crit)}
table.t tr.cur td{background:var(--brand-soft)}
table.t tr.autol td{background:var(--surface2)}
.agenda td .row{flex-wrap:nowrap}
.agenda h3{font:700 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;margin:0;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--line2)}
.agenda h3.late{color:var(--crit)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{border-left:2px solid var(--line);padding-left:10px}.log time{display:block;font-size:11.5px;color:var(--muted)}
a.wa{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.late{color:var(--crit);font-weight:600}
ul.dl{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.dk{display:inline-block;width:18px;font-weight:700;color:var(--brand-text)}
tr.diffrow td{background:var(--surface2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.imgbox{border:1px dashed var(--line);border-radius:4px;padding:10px;display:flex;gap:12px;align-items:center;background:var(--surface2)}
.imgbox img{max-height:90px;max-width:160px;object-fit:contain;background:#fff}
.preview-wrap{overflow:auto;background:#8E8A88;border-radius:var(--r);padding:20px;max-height:80vh}
.preview-wrap .doc{transform-origin:top left}
#pv{margin:0 auto}
.hide{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column}
  .side .brandbox{flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 16px}
  .side .logo{min-height:36px;padding:4px 8px}.side .logo img{max-height:28px}
  .side .brandbox .ps{flex:1;min-width:180px}
  .nav{flex-direction:row;overflow-x:auto;padding:6px 8px}
  .nav button{white-space:nowrap;padding:7px 10px}
  .side .foot{display:none}
  .kpis{position:static}
  .kpi{padding:8px 12px}.kpi .v{font-size:16px}
  .kpis .proj{width:100%;border-bottom:1px solid var(--line2);padding:8px 16px}
  .view{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== DOCUMENTO / PDF ===== */
.doc{--dc:#7F001B;--dc2:#2A2A30;width:816px;color:#1E1C1D;font:10.5pt/1.5 var(--f-body);background:transparent}
.doc .pg{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25);margin:0 auto 22px;width:816px}
.doc .cover{position:relative;height:1056px;overflow:hidden;background:#fff}
.doc .cover img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.doc .cover .ctext{position:absolute;color:#fff;display:flex;flex-direction:column;gap:10px}
.doc .cover .ctext.tl{left:7%;top:13%;width:46%}
.doc .cover .ctext.bl{left:7%;bottom:9%;width:60%}
.doc .cover .ctext.br{right:7%;bottom:9%;width:55%;text-align:right;align-items:flex-end}
.doc .cover .eyebrow{font:600 12pt var(--f-head);letter-spacing:.22em;text-transform:uppercase;opacity:.9}
.doc .cover .ttl{font:700 34pt/1.02 var(--f-head);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.doc .cover .stl{font:500 14pt/1.3 var(--f-head);opacity:.95}
.doc .cover .ctext.dark{color:#1E1C1D}.doc .cover .ctext.dark .meta{border-top-color:#1E1C1D55}
.doc .cover .meta{margin-top:14px;font:500 10.5pt/1.55 var(--f-body);opacity:.92;border-top:1px solid rgba(255,255,255,.45);padding-top:10px}
.doc .cover.gen .g1{position:absolute;left:0;top:0;width:62%;height:62%;background:var(--dc);clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%)}
.doc .cover.gen .g2{position:absolute;right:0;top:24%;width:52%;height:70%;background:var(--dc2);clip-path:polygon(35% 0,100% 0,100% 100%,35% 100%,0 50%)}
.doc .cover.gen .g3{position:absolute;left:0;bottom:0;width:100%;height:2.4%;background:var(--dc)}
.doc .cover.gen .g4{position:absolute;right:6%;bottom:12%;width:34%;height:30%;border:2px solid var(--dc);clip-path:polygon(25% 0,100% 0,75% 100%,0 100%)}
.doc .cover .clogo{position:absolute;right:6%;top:4.5%;max-width:32%;max-height:9%;object-fit:contain}
.doc .cover.gen .clogo{background:#fff;padding:6px}
.doc table.sheet{width:100%;border-collapse:collapse}
.doc table.sheet>thead td,.doc table.sheet>tfoot td{padding:0}
.doc .dh{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 8px;border-bottom:2px solid var(--dc);margin-bottom:14px}
.doc .dh img{max-height:38px;max-width:180px;object-fit:contain}
.doc .dh .r{text-align:right;font:500 8.5pt/1.35 var(--f-body);color:#5A5657}
.doc .dh .r b{font:700 10pt var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--dc)}
.doc .df{margin-top:12px;border-top:1px solid #D9D4D2;padding-top:6px;font-size:7.8pt;color:#6E696A;display:flex;justify-content:space-between;gap:10px}
.doc .inner{padding:40px 52px}
.doc .ds{break-inside:auto;margin-bottom:18px}
.doc h2.dt{font:700 14pt var(--f-head);letter-spacing:.05em;text-transform:uppercase;color:var(--dc);margin:0 0 8px;display:flex;gap:10px;align-items:baseline;break-after:avoid}
.doc h2.dt .no{font:700 11pt var(--f-mono);color:var(--dc2);opacity:.55}
.doc h3{font:700 11pt var(--f-head);letter-spacing:.06em;text-transform:uppercase;margin:0 0 5px;color:var(--dc2)}
.doc p{margin:0 0 8px;text-align:justify}
.doc ul{margin:0;padding-left:16px}.doc li{margin:1px 0}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.doc .box{border:1px solid #E1DBD9;border-top:3px solid var(--dc);padding:10px 12px;break-inside:avoid}
.doc .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.doc .steps div{background:#F5F2F1;padding:10px;border-radius:3px;break-inside:avoid}
.doc .steps b{display:block;font:700 10pt var(--f-head);color:var(--dc);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.doc table.dtb{width:100%;border-collapse:collapse;font-size:9pt;font-variant-numeric:tabular-nums}
.doc table.dtb th{background:var(--dc2);color:#fff;font:600 8.5pt var(--f-head);letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:6px 7px}
.doc table.dtb td{padding:5px 7px;border-bottom:1px solid #E6E1DF;vertical-align:top}
.doc table.dtb td.n,.doc table.dtb th.n{text-align:right;white-space:nowrap}
.doc table.dtb tr{break-inside:avoid}
.doc table.dtb tr.g td{background:#F4EFEE;color:var(--dc);font:700 9pt var(--f-head);letter-spacing:.07em;text-transform:uppercase}
.doc table.dtb tr.s td{font-weight:600;background:#FAF8F7}
.doc table.dtb tr.t td{font:700 11pt var(--f-head);border-top:2px solid var(--dc2);background:#fff}
.doc table.dtb tr.T td{font:700 12pt var(--f-head);background:var(--dc);color:#fff}
.doc .ck{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px;font-size:9.5pt}
.doc .ck div.nock::before{content:none}
.doc .ck div::before{content:"✓";color:var(--dc);font-weight:700;margin-right:7px}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;break-inside:avoid}
.doc .sign div{border-top:1px solid #1E1C1D;padding-top:6px;font-size:9pt}
.doc .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

function kitCalc(tid, n){
 const m = S.materials.find(x=>x.id===tid); const kit = (S.tubeKits||{})[m?.inst] || [];
 const rows = []; let ch = 0, to = 0, missing = [];
 kit.forEach((k,j)=>{
  const mat = k.m || (S.tubeSizes[tid]||{})[k.type] || "";
  const g = n / (+k.n||1), grupos = k.r==="arriba" ? ceil(g) : Math.floor(g + 1e-9);
  const q = (k.on && n>0 && +k.n>0) ? grupos * (+k.q||0) : 0;
  const c = q*(+k.fc||0), t = q*(+k.ft||0); ch += c; to += t;
  if (q && !mat) missing.push(k.label);
  rows.push({j, k, mat, q, c, t});
 });
 return {rows, ch, to, missing};
}

 st.materials.forEach(m=>{ m.name = String(m.name).replace("Grapa doble ala","Grapa doble ojo"); });
 DEF_PROFILES.forEach(p=>{ if (!st.profiles.some(x=>x.id===p.id)) st.profiles.push(clone(p)); });
 // canalización: de reglas por tubo a kit por familia
 if (!st.tubeKits){
  st.tubeKits = clone(DEF_TUBE_KITS); /* nuevo */ st.tubeSizes = clone(DEF_TUBE_SIZES); st.tubeFix = clone(DEF_TUBE_FIX); delete st.tubeRules;

 }
 Object.values(st.tubeKits).forEach(ks=>ks.forEach(k=>{ k.r ||= "abajo"; }));
 ["n12","n13"].forEach(id=>{ const seed = SEED_CATALOG.find(c=>c.id===id); if (seed && !st.catalog.some(c=>c.id===id || String(c.ref).toUpperCase()===seed.ref)) st.catalog.push(clone(seed)); });
 st.svcModes ||= clone(DEF_SVC_MODES); st.licRules ||= clone(DEF_LIC_RULES); st.licRules.forEach(r=>{ if (r.id==="hipcam" && r.base==="n11"){ r.base = "n12"; r.extra = "n13"; } }); st.brand.wa ||= DEF_WA; st.texts.checklist ||= clone(DEF_CHECKLIST);
 st.svcCosts ||= clone(DEF_PARAMS.svc.costs);

 if (!st.patches.includes("mo-base-v8")){ Object.values(st.projects).forEach(p=>{ if (p.labor && !+p.labor.transport && !+p.labor.imprev){ p.labor.transport = st.laborBase.transport; p.labor.imprev = st.laborBase.imprev; } }); st.patches.push("mo-base-v8"); }

// "huella" del proyecto para saber si hay cambios sin guardar (ignora historial y fechas internas)
function projHash(p){ const c = Object.assign({}, p); delete c.history; delete c.updated; delete c.savedHash; delete c.savedAt; const str = JSON.stringify(c); let h = 5381; for (let i=0;i<str.length;i++) h = ((h<<5) + h + str.charCodeAt(i)) | 0; return String(h); }
const unsaved = p => !p.savedHash || p.savedHash !== projHash(p);
async function syncDisk(all){
 try {
  const root = DISK.handle, pdir = await dirGet(root, "proyectos");
  if (dirty.cfg || all) await writeJson(root, "configuracion.json", configOf(S));
  const ids = all ? Object.keys(S.projects) : [...dirty.proj];
  for (const id of ids){
   const p = S.projects[id]; if (!p) continue;
   const name = projFile(p), old = DISK.files[id];
   await writeJson(pdir, name, p);
   if (old && old !== name){ try { await pdir.removeEntry(old); } catch(e){} }
   DISK.files[id] = name;
  }
  // respaldo diario completo (se conservan los últimos 30)
  const bdir = await dirGet(root, "respaldos"), day = today();
  if (DISK.lastBackup !== day){
   await writeJson(bdir, "respaldo_"+day+".json", S); DISK.lastBackup = day;
   const names = []; for await (const [n] of bdir.entries()) if (/^respaldo_\d{4}-\d\d-\d\d\.json$/.test(n)) names.push(n);
   names.sort().slice(0, Math.max(0, names.length-30)).forEach(n=>bdir.removeEntry(n).catch(()=>{}));
  }
  dirty = {cfg:false, proj:new Set()}; DISK.err = ""; DISK.last = new Date();
 } catch(e){ DISK.err = e.message || String(e); if (e.name==="NotAllowedError") DISK.ok = false; }
}

}
async function pickFolder(){

 let h; try { h = await window.showDirectoryPicker({id:"cotizador-datos", mode:"readwrite"}); } catch(e){ return; }

 let hasCfg = false; try { await h.getFileHandle("configuracion.json"); hasCfg = true; } catch(e){}
 if (hasCfg){ DISK.pending = true; render(); return; }

}
async function loadFromDisk(mode){ // mode: "replace" | "merge"
 try {
  const root = DISK.handle, cfg = await readJson(await root.getFileHandle("configuracion.json"));
  const pdir = await dirGet(root, "proyectos"), projects = {}; DISK.files = {};
  for await (const [n, fh] of pdir.entries()){ if (fh.kind!=="file" || !n.endsWith(".json")) continue; try { const p = await readJson(fh); if (p && p.id){ projects[p.id] = p; DISK.files[p.id] = n; } } catch(e){} }
  if (mode==="merge"){ Object.values(S.projects).forEach(p=>{ const d = projects[p.id]; if (!d || (p.updated||0) > (d.updated||0)) projects[p.id] = p; }); }
  else { Object.assign(S, cfg); }
  S.projects = Object.keys(projects).length ? projects : S.projects;
  if (!S.projects[S.active]) S.active = Object.keys(S.projects)[0];
  upgrade(S); DISK.pending = false; await IDB.set("state", S); await syncDisk(true);
  toast(Object.keys(projects).length+" proyectos cargados desde la carpeta"); render();
 } catch(e){ toast("No se pudo leer la carpeta: "+(e.message||e)); }
}
async function reconnect(){ try { DISK.ok = (await DISK.handle.requestPermission({mode:"readwrite"})) === "granted"; } catch(e){ DISK.ok = false; } if (DISK.ok){ await loadFromDisk("merge"); } render(); }

/* ---------- motor de cálculo ---------- */
function compute(P = proj()){
 const R = {};
 const mById = R.mById = Object.fromEntries(S.materials.map(m=>[m.id,m]));
 const cById = R.cById = Object.fromEntries(S.catalog.map(c=>[c.id,c]));
 const prById = R.prById = Object.fromEntries(S.profiles.map(p=>[p.id,p]));
 const resById = Object.fromEntries(S.reserves.map(r=>[r.id,r]));
 const M = P.margins;
 const pv = (cost, m) => m >= 100 ? 0 : cost / (1 - m/100);
 // líneas
 R.lines = P.lines.map((l,i)=>{
  const it = l.cat ? cById[l.cat] : null;
  const cost = l.cost != null ? +l.cost : (it ? +it.cost : 0);
  const margin = l.margin != null ? +l.margin : M.eq;
  const profile = l.profile !== undefined ? l.profile : (it ? it.profile : "");
  const qty = +l.qty || 0, price = pv(cost, margin);
  return {i, l, it, ref: l.ref ?? it?.ref ?? "", name: l.name ?? it?.name ?? "", spec: it?.spec || "", un: l.un ?? it?.un ?? "UND",
   sys: l.sys || it?.sys || S.systems[0], cost, margin, profile, qty, price, costT: cost*qty, saleT: price*qty, costOv: l.cost!=null, marOv: l.margin!=null, profOv: l.profile!==undefined};
 });
 // licencias automáticas (no se guardan como líneas: se recalculan siempre)
 // Un equipo cuenta si es el mismo del catálogo o si su referencia coincide (p. ej. "DS-K1T681DBWX(O-STD) HIPCAM")
 R.autoLines = []; R.licWarn = [];
 const nref = x => String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 const sameItem = (l, tid) => { if (l.cat===tid) return true; const a = cById[l.cat], t = cById[tid]; if (!a || !t) return false; const ra = nref(a.ref), rt = nref(t.ref); return rt.length>=8 && ra.length>=8 && (ra.includes(rt) || rt.includes(ra)); };
 const findCat = (id, ref) => cById[id] || S.catalog.find(c=>nref(c.ref)===nref(ref));
 (S.licRules||[]).forEach(r=>{
  if (!r.on) return;
  const trig = (ids) => P.lines.filter(l=>(ids||[]).some(id=>sameItem(l,id)));
  const lb = trig(r.baseTriggers), le = trig(r.extraTriggers);
  const tb = lb.reduce((a,l)=>a+(+l.qty||0),0), te = le.reduce((a,l)=>a+(+l.qty||0),0);
  if (!tb) return;
  const sys = lb[0].sys || cById[lb[0].cat]?.sys || "CONTROL DE ACCESO";
  const mk = (it, qty, why) => { if (!it || qty<=0) return; if (P.lines.some(l=>l.cat===it.id)) return; const cost = +it.cost||0, price = pv(cost, M.eq);
   R.autoLines.push({i:-1, auto:true, lic:true, why, l:{}, it, ref:it.ref, name:it.name, spec:it.spec||"", un:it.un||"UND", sys, cost, margin:M.eq, profile:"", qty, price, costT:cost*qty, saleT:price*qty}); };
  const bIt = findCat(r.base, "LIC-PROYECTO"), eIt = findCat(r.extra, "LIC-INTERCOM8");
  if (!bIt) R.licWarn.push("No se encuentra en el catálogo la licencia única de "+r.name);
  if (te > (+r.included||0) && !eIt) R.licWarn.push("No se encuentra en el catálogo la licencia adicional de "+r.name);
  const inc = +r.included||0, extra = Math.max(0, te - inc);
  mk(bIt, 1, "Activa la plataforma del proyecto e incluye la licencia de "+num(inc)+" terminal"+(inc===1?"":"es")+" de 8\".");
  mk(eIt, extra, "Una por cada terminal de 8\" adicional: "+num(te)+" terminal"+(te===1?"":"es")+" − "+num(inc)+" incluida"+(inc===1?"":"s")+" = "+num(extra)+".");
 });
 R.licSale = R.autoLines.reduce((a,x)=>a+x.saleT,0); R.licCost = R.autoLines.reduce((a,x)=>a+x.costT,0);
 R.lines = R.lines.concat(R.autoLines);
 // conteo por perfil
 const cnt = R.cnt = {}; let eqUnits = 0;
 R.lines.forEach(x=>{ if (!x.auto) eqUnits += x.qty; if (x.profile && prById[x.profile]) cnt[x.profile] = (cnt[x.profile]||0) + x.qty; });
 R.eqUnits = eqUnits;
 // materiales
 const base = {}; const add = (mid, q, src) => { if (mid==="@UTP") mid = P.utp; if (!mid || !q) return; const b = base[mid] || (base[mid] = {q:0, src:[]}); b.q += q; b.src.push([src, q]); };
 Object.entries(cnt).forEach(([pid,n])=>{ const pr = prById[pid]; pr.mats.forEach(r=>add(r.m, (+r.q||0)*n, pr.name+" × "+num(n))); });
 // canalización
 const tubes = R.tubes = {};
 R.cableEq = Object.entries(base).reduce((a,[id,b])=>a + ((mById[id]?.inst==="utp"||mById[id]?.inst==="cable") ? b.q : 0), 0);
 P.cpct = P.cpct || {};
 S.materials.filter(m=>+m.len>0).forEach(m=>{
  let fromEq = 0; Object.entries(cnt).forEach(([pid,n])=>{ const pr = prById[pid]; if (pr.tube===m.id) fromEq += (+pr.tm||0)*n; });
  const pctM = R.cableEq * (+(P.cpct[m.id]||0))/100;
  const extra = +(P.conduit[m.id]||0), meters = fromEq + pctM + extra, count = meters>0 ? ceil(meters / m.len) : 0;
  tubes[m.id] = {fromEq, pctM, extra, meters, count};
  if (count) add(m.id, count, "Canalización "+num(meters)+" m ÷ "+num(m.len)+" m");
 });
 R.tubeTotal = Object.values(tubes).reduce((a,t)=>a+t.count,0);
 R.kitMissing = [];
 Object.entries(tubes).forEach(([tid, t])=>{
  if (!t.count) return;
  const kc = kitCalc(tid, t.count), nm = tubeShort(mById[tid]);
  kc.rows.forEach(r=>{ if (r.q && r.mat) add(r.mat, r.q, nm+": "+r.k.label.toLowerCase()+" "+num(r.k.q)+" por cada "+num(r.k.n)+" tubo(s)"); });
  if (kc.ch) add(S.tubeFix.chazo, kc.ch, nm+": fijación de accesorios");
  if (kc.to) add(S.tubeFix.tornillo, kc.to, nm+": fijación de accesorios");
  kc.missing.forEach(x=>R.kitMissing.push(nm+" · "+x));
 });
 R.derivedRes = [];
 S.derived.forEach((d,j)=>{

function monitoring(P, R){

function srcName(src, mById){ if (src==="@EQ") return "Total equipos instalados"; if (src==="@TUBOS") return "Total tubos (todas las medidas)"; return (mById||{})[src]?.name || src; }

function audit(P, R){

 add(noCost.length?"crit":"ok","Líneas sin costo", noCost.length ? noCost.map(x=>x.name||x.ref).join(", ") : "0", "Complete el costo en Catálogo o en la línea");
 const noProf = R.lines.filter(x=>!x.profile && !x.auto && x.sys!=="OBRAS Y SERVICIOS");
 add(noProf.length?"warn":"ok","Líneas sin regla técnica (no generan materiales ni instalación)", noProf.length? noProf.map(x=>x.name||x.ref).join(", ") : "0", "Asigne una regla por equipo");

 const tgt = +P.margins.min||0;
 add(R.sub===0?"info":(R.margin*100 >= tgt - 1e-6 ? "ok":"crit"), "Margen bruto del proyecto ≥ mínimo ("+num(tgt)+" %)", pct(R.margin), "Revise márgenes o costos");

 add(odd.length?"warn":"ok","Tarifas de instalación atípicas (> 3× costo del equipo)", odd.length? [...new Set(odd)].join("; ") : "0", "Valide si la tarifa es por unidad o global");

function historyPanel(){
 const P = proj(), H = P.history || [];
 const open = V._diff;
 const rows = H.map(h=>{ let extra = "";
  if (open===h.id){ const d = diffVersion(P, h);
   extra = `<tr class="diffrow"><td colspan="6"><div class="small"><b>Esa versión:</b> ${money(h.sum.total)} · margen ${pct(h.sum.margin)} · ${num(h.sum.units)} equipos &nbsp;→&nbsp; <b>Ahora:</b> ${money(d.cur.total)} · margen ${pct(d.cur.margin)} · ${num(d.cur.units)} equipos (${d.cur.total-h.sum.total>=0?"+":""}${money(d.cur.total-h.sum.total)})</div>
    ${d.out.length?`<ul class="dl">${d.out.map(([k,n,t])=>`<li><span class="dk">${k}</span>${esc(n)} — <span class="muted">${esc(t)}</span></li>`).join("")}</ul>`:`<div class="small muted">Mismos equipos y cantidades. Las diferencias vienen de precios, reglas o parámetros.</div>`}</td></tr>`; }
  return `<tr><td class="small">${fmtDT(h.at)}</td><td>${esc(h.note)}${h.auto?` <span class="small muted">(automática)</span>`:""}</td><td>${stPill(h.status)}</td><td class="n">${money(h.sum.total)}</td><td class="n">${pct(h.sum.margin)}</td>
  <td class="n"><button class="btn sm ghost" data-act="diffV" data-id="${h.id}">${open===h.id?"Ocultar":"Comparar"}</button><button class="btn sm" data-act="restoreV" data-id="${h.id}" id="rv_${h.id}">Restaurar</button><button class="btn sm ghost" data-act="forkV" data-id="${h.id}">Copiar como nuevo</button><button class="btn sm ghost danger" data-act="delV" data-id="${h.id}" id="dv_${h.id}" title="Borrar esta versión">Borrar</button></td></tr>${extra}`; }).join("");
 return `<div class="panel"><div class="ph"><h2>Historial de versiones</h2><div class="row"><input type="text" id="verNote" placeholder="Nota: p. ej. “Ajuste por visita técnica”" style="width:260px"><button class="btn sm pri" data-act="saveVersion">Guardar versión</button>${H.some(h=>h.auto)?`<button class="btn sm danger" data-act="delAutoV" id="btnDelAuto">Borrar automáticas</button>`:""}</div></div>
 <div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Nota</th><th>Estado</th><th class="n">Total</th><th class="n">Margen</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted small">Aún no hay versiones. Pulse “Guardar” arriba (o Ctrl + S) cada vez que quiera dejar una foto de la cotización. Al exportar el PDF o cambiar el estado se guarda una versión automática.</td></tr>`}</tbody></table></div></div>`;
}
function waLink(p){
 const d = String(p.cphone||"").replace(/\D/g,""); if (d.length < 7) return "";
 const num57 = d.length===10 ? "57"+d : d;
 const r = compute(p), b = S.brand;
 const txt = String(b.wa||DEF_WA).replace(/\{(\w+)\}/g,(m,k)=>({contacto:p.contact||"", cliente:p.client||"", num:p.num, total:money(r.total), asesor:p.by||b.by||"", empresa:b.short||b.company, fecha:fmtDate(p.date)}[k] ?? m));
 return "https://wa.me/"+num57+"?text="+encodeURIComponent(txt);
}
const waBtn = (p, cls="btn sm") => { const u = waLink(p); return u ? `<a class="${cls} wa" href="${u}" target="_blank" rel="noopener">WhatsApp</a>` : ""; };
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };

 return `<div class="panel"><div class="ph"><h2>Estado y seguimiento</h2><div class="row">${stPill(P.status)}${waBtn(P)}${P.status==="aprobada"?`<button class="btn sm pri" data-act="printOT">Orden de trabajo PDF</button><button class="btn sm" data-act="exportOT">Exportar OT (JSON)</button>`:""}</div></div><div class="pb grid">
  ${fld("Estado comercial", `<select id="f_status" data-status="1">${STATUS.map(s=>`<option value="${s[0]}" ${P.status===s[0]?"selected":""}>${s[1]}</option>`).join("")}</select>`, "", "Al cambiarlo se guarda una versión automática. En “Aprobada” se habilita la orden de trabajo.")}

  <select id="logNext"><option value="3">Próxima en 3 días</option><option value="7" selected>Próxima en 1 semana</option><option value="14">Próxima en 2 semanas</option><option value="0">Sin próxima gestión</option></select>
  <button class="btn sm pri" data-act="addLog">Registrar</button></div>
  ${L.length?`<ul class="log" style="margin-top:12px">${L.slice(0,12).map(g=>`<li><time>${fmtDT(g.at)}</time>${esc(g.text)}</li>`).join("")}</ul>`:""}
  ${fld("Notas generales", inp("P.follow","area",'style="min-height:54px"'), "wide")}
 </div></div>`;

function agendaPanel(){
 const t = today(), wk = addDays(7);
 const open = Object.values(S.projects).filter(p=>p.next && !["aprobada","perdida"].includes(p.status));
 const groups = [["late","Vencidas",p=>p.next<t],["","Hoy",p=>p.next===t],["","Próximos 7 días",p=>p.next>t && p.next<=wk]];
 const row = p => { const r = compute(p), last = (p.log||[])[0]; return `<tr><td><a href="#" data-act="openProj" data-id="${p.id}"><b>${esc(p.client||"Sin nombre")}</b></a><div class="src">${esc(p.num)}${last?" · "+esc(last.text):""}</div></td><td>${stPill(p.status)}</td><td class="n">${money(r.total)}</td><td class="small">${fmtDate(p.next)}</td>
  <td class="n"><div class="row" style="justify-content:flex-end">${waBtn(p,"btn sm ghost")}<button class="btn sm ghost" data-act="snooze" data-id="${p.id}" data-d="3">+3 días</button><button class="btn sm ghost" data-act="snooze" data-id="${p.id}" data-d="7">+7 días</button><button class="btn sm" data-act="openProj" data-id="${p.id}">Abrir</button></div></td></tr>`; };
 const html = groups.map(([cls,title,fn])=>{ const ps = open.filter(fn).sort((a,b)=>a.next<b.next?-1:1); if (!ps.length) return ""; return `<h3 class="${cls}">${title} (${ps.length})</h3><div class="tw"><table class="t"><tbody>${ps.map(row).join("")}</tbody></table></div>`; }).join("");
 const lostP = Object.values(S.projects).filter(p=>p.status==="perdida");
 const reasons = LOST_REASONS.map(([k,n])=>{ const ps = lostP.filter(p=>p.lostReason===k); return ps.length?`<tr><td>${n}</td><td class="n">${ps.length}</td><td class="n">${money(ps.reduce((a,p)=>a+compute(p).total,0))}</td></tr>`:""; }).join("");
 const noR = lostP.filter(p=>!p.lostReason).length;
 return `<div class="panel agenda"><div class="ph"><h2>Agenda de seguimiento</h2><span class="hint">Gestiones pendientes de cotizaciones abiertas</span></div>${html || `<div class="pb small muted">No hay gestiones pendientes para esta semana. Ponga una fecha de “Próxima gestión” en cada cotización enviada.</div>`}</div>
 <div class="panel"><div class="ph"><h2>¿Por qué se pierden?</h2><span class="hint">${lostP.length} cotizaciones perdidas</span></div>${reasons||noR?`<div class="tw"><table class="t"><thead><tr><th>Motivo</th><th class="n">Cant</th><th class="n">Valor</th></tr></thead><tbody>${reasons}${noR?`<tr class="dim"><td>Sin motivo registrado</td><td class="n">${noR}</td><td></td></tr>`:""}</tbody></table></div>`:`<div class="pb small muted">Cuando marque una cotización como perdida, registre el motivo para ver aquí el patrón.</div>`}</div>`;
}

 return `<div class="vhead"><div><h1 class="vt">Proyecto</h1><p class="vsub">Datos del cliente, parámetros comerciales y supuestos técnicos. Cada proyecto nuevo empieza en blanco; solo hereda los parámetros comerciales de la empresa.</p></div>

 </div></div>

  ${fld("Nombre", inp("P.by"))}${fld("Cargo", inp("P.role"))}${fld("Teléfono", inp("P.phone"))}${fld("Correo", inp("P.email"))}

 </div></div>
 </div>
 ${statusPanel()}
 ${historyPanel()}
 <div class="panel"><div class="ph"><h2>Parámetros comerciales</h2><span class="hint">Cambian el precio de todo el proyecto</span></div>
 <div class="pb grid">
  ${fld("Margen equipos %", inp("P.margins.eq","n"), "", "Ganancia sobre el precio de venta de cada equipo. Se puede cambiar por línea en Cotización.")}
  ${fld("Margen materiales %", inp("P.margins.mat","n"), "", "Se aplica al costo total de la lista de materiales (cable, tubería, accesorios).")}
  ${fld("Margen mano de obra y mantenimiento %", inp("P.margins.mo","n"), "", "Se aplica al costo de instalación y al mantenimiento anual.")}
  ${fld("Margen mínimo aceptable %", inp("P.margins.min","n"), "", "Piso comercial. Si el proyecto o una línea queda por debajo, la auditoría lo marca.")}
  ${fld("IVA %", inp("P.iva","n"), "", "IVA pleno sobre la venta de la implementación (equipos, materiales, instalación).")}
  ${fld("Mantenimiento anual en el total", `<div class="row">${inp("P.inclMaint","b")}<small class="muted">Suma al proyecto; nunca se financia</small></div>`, "", "Desmarcado: aparece en la propuesta como valor anual opcional.")}
 </div>
 <div class="pb"><div class="note"><b>Cómo se forma el precio.</b> El margen se calcula sobre el precio de venta, no sobre el costo: <b>Precio = Costo ÷ (1 − margen)</b>.
  Con ${num(m)} %, un equipo que cuesta ${money(c0)} se vende a <b>${money(pv0)}</b> y deja ${money(pv0-c0)}, que es el ${num(m)} % del precio.
  Sumarle el ${num(m)} % al costo daría ${money(c0*(1+m/100))} y una ganancia real de solo ${pct(m? (c0*m/100)/(c0*(1+m/100)) : 0)}.

function catOptions(){

  const items = S.catalog.filter(c=>c.sys===s); if (!items.length) return "";
  return `<optgroup label="${esc(s)}">${items.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.ref)} · ${money(c.cost)}</option>`).join("")}</optgroup>`;
 }).join("");
}
function profOptions(withCat, catProf){

 if (withCat) o.push(["", "Según catálogo"+(catProf ? " ("+(R.prById[catProf]?.name||"—")+")" : " (sin regla)")]);
 o.push(["-","— Sin reglas —"]);
 S.profiles.forEach(p=>o.push([p.id,p.name]));
 return o;
}
V.cotizacion = () => {

 let body = "";

 groups.forEach(s=>{
  const ls = R.lines.filter(x=>x.sys===s); if (!ls.length) return;
  const sc = ls.reduce((a,x)=>a+x.costT,0), sv = ls.reduce((a,x)=>a+x.saleT,0);
  body += `<tr class="grp"><td colspan="11">${esc(s)}</td></tr>`;
  ls.forEach(x=>{
   if (x.auto){ body += `<tr class="autol"><td><span class="mono">${esc(x.ref)}</span></td><td><div>${esc(x.name)}</div><div class="src"><b>Licencia automática</b> · ${esc(x.why)}</div></td><td class="small muted">${esc(x.sys)}</td><td class="small muted">Visible para el cliente en la propuesta</td><td class="n"><b>${num(x.qty)}</b></td><td class="n">${money(x.cost)}</td><td class="n">${num(x.margin)}</td><td class="n">${money(x.price)}</td><td class="n"><b>${money(x.saleT)}</b></td><td class="n muted">${money(x.costT)}</td><td></td></tr>`; return; }

   const refCell = x.it ? `<span class="mono">${esc(x.ref)}</span>` : inp(b+".ref","t",'placeholder="Referencia"');

   body += `<tr>

    <td class="n"><input type="number" step="any" id="${fid(b+".cost")}" data-p="${b}.cost" data-t="n" data-null="1" value="${x.cost}" ${x.costOv?'style="border-color:var(--warn)"':""} title="${x.costOv?"Costo modificado solo en esta cotización":"Costo del catálogo"}">${x.costOv&&x.it?`<button class="x" title="Volver al costo del catálogo" data-act="resetCost" data-i="${x.i}">↺</button>`:""}</td>
    <td class="n"><input type="number" step="any" class="w60" id="${fid(b+".margin")}" data-p="${b}.margin" data-t="n" data-null="1" value="${x.margin}" ${x.marOv?'style="border-color:var(--warn)"':""}></td>

  });
  body += `<tr class="sub"><td colspan="8">Subtotal ${esc(s)}</td><td class="n">${money(sv)}</td><td class="n muted">${money(sc)}</td><td></td></tr>`;
 });

 return `<div class="vhead"><div><h1 class="vt">Cotización</h1><p class="vsub">Seleccione equipos del catálogo. Cada equipo trae su regla técnica, que genera materiales, tubería, horas de instalación y mantenimiento automáticamente.</p></div></div>

 </div></div>
 <div class="panel">${empty || `<div class="tw"><table class="t"><thead><tr><th>Referencia</th><th>Descripción</th><th>Sistema</th><th>Regla técnica</th><th class="n">Cant</th><th class="n">Costo unit</th><th class="n">Marg %</th><th class="n">P.V. unit</th><th class="n">P.V. total</th><th class="n">Costo total</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`}</div>
 <div class="panel"><div class="ph"><h2>Implementación y servicios</h2><span class="hint">Calculados desde Materiales y Costos</span></div><div class="tw"><table class="t">

  <tr><td>Materiales de instalación (cableado, canalización, accesorios)</td><td class="muted small"><a href="#" data-go="materiales">${R.bom.filter(r=>r.fin).length} ítems con reserva</a></td><td class="n">${money(R.matCost)}</td><td class="n">${num(P.margins.mat)} %</td><td class="n">${money(R.matSale)}</td></tr>

 <div class="tiles">

 }).join("");

  const sizedTypes = kit.filter(k=>!k.m);
  const srows = sizes.map(m=>{ const t = R.tubes[m.id]||{count:0}; return `<tr><td><b>${esc(tubeShort(m))}</b><div class="src">${num(t.count)} tubos en el proyecto</div></td><td class="n">${inp("S.materials."+S.materials.indexOf(m)+".len","n",'class="w60"')} m</td>${sizedTypes.map(k=>`<td style="min-width:150px">${selMat("S.tubeSizes."+m.id+"."+k.type, [["","— No aplica —"]])}</td>`).join("")}</tr>`; }).join("");
  // simulador

 return `<div class="vhead"><div><h1 class="vt">Reglas técnicas</h1><p class="vsub">Aquí se define la ingeniería: qué consume cada equipo, qué accesorios lleva cada tubo y qué fijación lleva cada accesorio. Cambie un número y todo el proyecto se recalcula.</p></div>

  ${fld("Gastos administración % ingreso", inp("P.svc.adm","n"))}${fld("Gastos venta % ingreso", inp("P.svc.vta","n"))}

  <tr class="tot"><td colspan="4">Total costos mensuales</td><td class="n">${money(M.cSum)}</td><td class="n">${money(M.cSum/u)}</td><td></td></tr></tbody></table></div></div>
 <div class="cols2">${pl(M.solo,"Solo servicio",false)}${pl(M.con,"Servicio + equipos financiados",true)}</div>

 <div class="panel"><div class="ph"><h2>Esquema de ahorro</h2><span class="hint">Valores antes de IVA, como en la plantilla</span></div><div class="tw"><table class="t"><thead><tr><th>Escenario</th><th class="n">Propuesta / mes</th><th class="n">Ahorro $</th><th class="n">Ahorro %</th></tr></thead><tbody>

  ${ah(hib?"Solo servicios (virtual + físico)":"Solo servicio", M.propSolo, M.ahorroSolo, M.ahorroSoloPct)}

V.resumen = () => {
 const P = proj();
 const parts = [["Materiales",R.matSale,R.matCost],["Mano de obra",R.moSale,R.moCost]].concat(P.inclMaint?[["Mantenimiento",R.maintSale,R.maintCost]]:[]);
 const sysRows = Object.entries(R.bySys).filter(([s,b])=>b.sale).map(([s,b])=>`<tr><td>${esc(s)}</td><td class="n">${num(b.n)}</td><td class="n">${money(b.cost)}</td><td class="n">${money(b.sale)}</td><td class="n">${money(b.sale-b.cost)}</td><td class="n">${b.sale?pct((b.sale-b.cost)/b.sale):"—"}</td><td><div class="bar"><i style="width:${R.sub?(b.sale/R.sub*100).toFixed(1):0}%"></i></div></td></tr>`).join("");
 const partRows = parts.map(([n,s,c])=>`<tr><td>${n}</td><td class="n">—</td><td class="n">${money(c)}</td><td class="n">${money(s)}</td><td class="n">${money(s-c)}</td><td class="n">${s?pct((s-c)/s):"—"}</td><td><div class="bar"><i style="width:${R.sub?(s/R.sub*100).toFixed(1):0}%"></i></div></td></tr>`).join("");
 const lab = {ok:"OK",warn:"Revisar",crit:"Crítico",info:"Info"};
 const au = R.audit.map(a=>`<tr><td><span class="pill ${a.s}">${lab[a.s]}</span></td><td>${esc(a.ctl)}</td><td class="small">${esc(a.val)}</td><td class="small muted">${a.s==="ok"?"":esc(a.act)}</td></tr>`).join("");
 const c = {ok:0,warn:0,crit:0,info:0}; R.audit.forEach(a=>c[a.s]++);
 const verdict = c.crit ? ["crit","No enviar: hay controles críticos"] : c.warn ? ["warn","Enviar con supuestos por validar"] : ["ok","Lista para enviar"];
 return `<div class="vhead"><div><h1 class="vt">Resumen y auditoría</h1><p class="vsub">Vista de gerencia: rentabilidad, composición y controles de interventoría antes de emitir la propuesta.</p></div></div>
 <div class="tiles">
  <div class="tile hi"><span class="l">Total cliente con IVA</span><span class="v">${money(R.total)}</span><span class="s">Venta sin IVA ${money(R.sub)}</span></div>
  <div class="tile"><span class="l">Margen bruto</span><span class="v">${money(R.marginAmt)}</span><span class="s">${pct(R.margin)} · mínimo ${num(P.margins.min)} %</span></div>
  <div class="tile"><span class="l">Cuota ${R.planA.n} meses</span><span class="v">${money(R.planA.fin)}</span><span class="s">Total mensual con monitoreo ${money(R.monthA)}</span></div>
  <div class="tile"><span class="l">Monitoreo · utilidad / mes</span><span class="v">${money(R.svc.con.op)}</span><span class="s">Con equipos ${pct(R.svc.con.opPct)} · solo servicio ${pct(R.svc.solo.opPct)}</span></div>
 </div>
 <div class="panel"><div class="ph"><h2>Desglose por sistema y componente</h2></div><div class="tw"><table class="t"><thead><tr><th>Sistema</th><th class="n">Und</th><th class="n">Costo</th><th class="n">Venta sin IVA</th><th class="n">Margen $</th><th class="n">Margen %</th><th>% del total</th></tr></thead><tbody>${sysRows}${partRows}<tr class="tot"><td>Total proyecto</td><td></td><td class="n">${money(R.cost)}</td><td class="n">${money(R.sub)}</td><td class="n">${money(R.marginAmt)}</td><td class="n">${pct(R.margin)}</td><td></td></tr></tbody></table></div></div>
 <div class="panel"><div class="ph"><h2>Auditoría de la cotización</h2><span class="pill ${verdict[0]}">${verdict[1]}</span></div><div class="tw"><table class="t"><thead><tr><th>Estado</th><th>Control</th><th>Valor actual</th><th>Acción</th></tr></thead><tbody>${au}</tbody></table></div>
 <div class="pb small muted">${c.ok} OK · ${c.warn} por revisar · ${c.crit} críticos · ${c.info} informativos</div></div>
 <div class="panel"><div class="ph"><h2>Hallazgos corregidos del Excel original</h2><span class="hint">Revisión de interventoría</span></div><div class="pb"><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px">
  <li>La detección de equipos buscaba texto dentro de la referencia (SEARCH "IP", "MAGNETICO"…). Ahora cada equipo del catálogo tiene una regla técnica asignada: sin falsos positivos.</li>
  <li>En el catálogo, CCTV y Alarma tenían nombre y modelo invertidos; dos cámaras distintas compartían la referencia "Bala IP 4 Megapixel". Se normalizó: código = modelo del fabricante.</li>
  <li>La tubería se digitaba en número de tubos sin relación con los equipos. Ahora sale de metros por equipo + metros de troncales, y los accesorios de las reglas por tubería.</li>
  <li>Faltaba la caja Rawelt 2400 en la lista de materiales; se agregó con regla configurable junto a la 5800.</li>
  <li>Los días de instalación estaban fijos en 30 aunque la hoja decía "automático", y la jornada técnica dominaba el costo sin importar el alcance. Ahora días = horas ÷ (técnicos × horas por jornada), con opción de fijarlos.</li>
  <li>El P&amp;L decía "IVA sobre tarifa servicio (19%)" pero calculaba 1,9 %. Ahora el IVA del servicio es un parámetro explícito.</li>
  <li>La financiación incluía el mantenimiento anual (hallazgo de la propia auditoría). Ahora la base financiable es solo la implementación.</li>
  <li>El resumen de auditoría era estático y un carácter "c" suelto aparecía en la propuesta detallada. Aquí todo se calcula en vivo.</li>
 </ul></div></div>
 <div class="panel"><div class="ph"><h2>Hallazgos del segundo cotizador y de la plantilla de monitoreo</h2><span class="hint">Incorporados o corregidos</span></div><div class="pb"><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px">
  <li>La tabla de amortización tenía la cuota 7 reemplazada por la suma de 6 cuotas: el saldo quedaba negativo desde el mes 19. Aquí la tabla siempre cierra en cero.</li>
  <li>El costo usado en la cotización no coincidía con el valor de compra en varias líneas (terminal 8": $2.793.174 vs $855.000; NVR, contactos, detectores). Revise esos costos en Catálogo.</li>
  <li>La hoja para el cliente mostraba las columnas de costo. La propuesta PDF solo muestra precios de venta.</li>
  <li>Terminales, curvas, uniones y cajas se calculaban con decimales (4,72 uniones). Aquí todo accesorio se redondea hacia arriba.</li>
  <li>En la plantilla de monitoreo la cuota de equipos venía siempre del escenario híbrido, con 36 cuotas, aunque el contrato fuera de 24 meses y el costo de equipos distinto. Aquí sale de la cotización activa y la auditoría avisa si los plazos no coinciden.</li>
  <li>En la plantilla, el escenario híbrido usaba dos tarifas distintas para el mismo servicio físico ($8.269.052 y $10.362.623). Aquí hay una sola tarifa para ambos esquemas de ahorro.</li>
  <li>El gasto de venta por apartamento se calculaba sobre la utilidad y no sobre el ingreso, y la etiqueta de descuento leía una celda vacía. Corregido.</li>
  <li>Se incorporó: tributación del monitoreo con base gravable 10 % × IVA 19 % = 1,9 %, costos por apartamento, escenarios solo servicio y con equipos, modalidad híbrida con vigilancia física, esquema de ahorro, alternativa de pago sin interés, correctivo por % de equipos que fallan y tubería como % del cable.</li>
 </ul></div></div>`;
};

 const prof = [["","— Sin regla —"]].concat(S.profiles.map(p=>[p.id,p.name]));
 const rows = S.catalog.map((c,i)=>({c,i})).filter(({c})=>!q || (c.ref+" "+c.name+" "+c.sys).toLowerCase().includes(q)).map(({c,i})=>{ const b="S.catalog."+i; return `<tr><td>${sel(b+".sys",sysOpts)}</td><td>${inp(b+".ref","t",'class="mono"')}</td><td style="min-width:240px">${inp(b+".name")}</td><td style="min-width:200px">${inp(b+".spec")}</td><td>${inp(b+".un","t",'style="width:64px"')}</td><td class="n">${inp(b+".cost","n")}</td><td>${sel(b+".profile",prof)}</td><td><button class="x" data-act="delCat" data-i="${i}" title="Eliminar del catálogo">×</button></td></tr>`; }).join("");

 <div class="panel"><div class="ph"><h2>Materiales (${S.materials.length})</h2><button class="btn sm" data-act="addMat">+ Material</button></div>
 <div class="tw"><table class="t"><thead><tr><th>Grupo</th><th>Material</th><th>UN</th><th class="n">Costo COP</th><th>Reserva</th><th>Instalación / m</th><th class="n">Tramo m</th><th class="n">Empaque</th><th></th></tr></thead><tbody>${mrows}</tbody></table></div></div>`;
};

/* ---------- documento PDF ---------- */
function fillVars(s){ const P = proj(), b = S.brand; return String(s||"").replace(/\{(\w+)\}/g,(m,k)=>({empresa:b.short||b.company,cliente:P.client,veh:P.veh,ped:P.ped,mbps:P.mbps,dias:P.rec,unidades:P.units,ciudad:P.city}[k] ?? m)); }
function docHead(title){ const b = S.brand, P = proj(); return `<div class="dh">${b.logo?`<img src="${b.logo}" alt="">`:`<b style="font:700 14pt var(--f-head);color:var(--dc)">${esc(b.company)}</b>`}<div class="r"><b>${esc(title)}</b><br>${esc(P.client)} · ${esc(P.num)}<br>${fmtDate(P.date)}</div></div>`; }
function docFoot(){ const b = S.brand; return `<div class="df"><span>${esc(b.company)}${b.nit?" · NIT "+esc(b.nit):""}</span><span>${[b.address,b.city,b.phone,b.email,b.web].filter(Boolean).map(esc).join(" · ")}</span></div>`; }
function cover(){
 const b = S.brand, P = proj();
 const txt = `<div class="ctext ${b.coverPos||"tl"}"><div class="eyebrow">${esc(b.coverTitle)}</div><div class="ttl">${esc(P.client||"Cliente")}</div><div class="stl">${esc(b.coverSub)}</div><div class="meta">${esc(P.num)} · ${fmtDate(P.date)}<br>Vigencia ${num(P.validity)} días<br>Preparado por ${esc(P.by)} · ${esc(P.role)}</div></div>`;
 if (b.coverMode==="image" && b.cover) return `<section class="pg cover"><img class="bg" src="${b.cover}" alt="">${txt}</section>`;
 return `<section class="pg cover gen"><div class="g1"></div><div class="g2"></div><div class="g4"></div><div class="g3"></div>${b.logo?`<img class="clogo" src="${b.logo}" alt="">`:""}${(b.coverPos||"tl")==="tl" ? txt : txt.replace('class="ctext', 'class="ctext dark')}</section>`;
}
function docProposal(){
 const P = proj(), b = S.brand, T = S.texts, o = P.pdf; let n = 0;
 const H = t => `<h2 class="dt"><span class="no">${String(++n).padStart(2,"0")}</span>${esc(t)}</h2>`;
 let s = "";
 if (o.present) s += `<div class="ds">${H("Presentación")}<p>${esc(fillVars(T.presentacion))}</p><h3>Quiénes somos</h3><p>${esc(fillVars(T.quienes))}</p>
  <div class="two"><div class="box"><h3>Capacidades</h3><ul>${T.capacidades.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="box"><h3>Compromiso de servicio</h3><ul>${T.compromiso.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>`;
 if (o.diag) s += `<div class="ds">${H("Diagnóstico general del inmueble")}<p>${esc(fillVars(T.diagnostico))}</p>
  <div class="kv"><div><span>Unidades</span><b>${num(P.units)}</b></div><div><span>Accesos vehiculares / peatonales</span><b>${num(P.veh)} / ${num(P.ped)}</b></div><div><span>Grabación · Internet</span><b>${num(P.rec)} días · ${num(P.mbps)} Mbps</b></div></div></div>`;
 if (o.sol) s += `<div class="ds">${H("Solución propuesta")}<div class="two">${T.solucion.map(x=>`<div class="box"><h3>${esc(x.t)}</h3><ul>${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
 if (o.modelo) s += `<div class="ds">${H("Modelo operativo")}<div class="steps">${T.modelo.map((x,i)=>`<div><b>${i+1} · ${esc(x.t)}</b>${esc(x.d)}</div>`).join("")}</div></div>`;
 if (o.eco){
  let rows = `<tr><td>Equipos y sistemas</td><td class="n">${money(R.eqSale - R.licSale)}</td><td>Pago único</td></tr>
   ${R.licSale?`<tr><td>Licencias de software (${R.autoLines.map(x=>num(x.qty)+" × "+esc(x.name.toLowerCase())).join(" + ")})</td><td class="n">${money(R.licSale)}</td><td>Pago único</td></tr>`:""}
   <tr><td>Materiales de instalación (cableado, canalización y accesorios)</td><td class="n">${money(R.matSale)}</td><td>Pago único</td></tr>
   <tr><td>Instalación, configuración y puesta en marcha</td><td class="n">${money(R.moSale)}</td><td>Pago único</td></tr>
   ${P.inclMaint?`<tr><td>Mantenimiento preventivo y correctivo (año 1)</td><td class="n">${money(R.maintSale)}</td><td>Anual</td></tr>`:""}
   <tr class="t"><td>Total implementación antes de IVA</td><td class="n">${money(R.sub)}</td><td></td></tr>
   <tr><td>IVA ${num(P.iva)} %</td><td class="n">${money(R.iva)}</td><td></td></tr>
   <tr class="T"><td>Total implementación con IVA</td><td class="n">${money(R.total)}</td><td></td></tr>`;
  if (!P.inclMaint && R.maintSale) rows += `<tr><td colspan="3" class="small">Mantenimiento anual opcional (preventivo y correctivo): ${money(R.maintSale)} antes de IVA.</td></tr>`;
  s += `<div class="ds">${H("Propuesta económica")}<table class="dtb"><thead><tr><th>Concepto</th><th class="n">Valor</th><th>Periodicidad</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  if (o.fin || o.svc){
   const dsc = (+P.svc.desc||0)/100;
   const col = (p) => `<table class="dtb"><thead><tr><th colspan="2">Alternativa ${p.n} ${p.n===1?"mes":"meses"}</th></tr></thead><tbody>
    ${o.svc?`<tr><td>Monitoreo base</td><td class="n">${money(R.svc.base)}</td></tr><tr><td>IVA monitoreo ${num(R.svc.ivaEf)} %</td><td class="n">${money(R.svc.iva)}</td></tr><tr class="s"><td>Monitoreo final</td><td class="n">${money(R.svc.final)}</td></tr>`:""}
    ${o.fin?`<tr><td>Cuota implementación${p.noInt?" (sin interés)":""}${dsc?" − "+num(P.svc.desc)+" % desc.":""}</td><td class="n">${money(p.cuota*(1-dsc))}</td></tr><tr><td>IVA preferencial ${num(R.ivaPref)} %</td><td class="n">${money(p.ivaC*(1-dsc))}</td></tr><tr class="s"><td>Cuota final</td><td class="n">${money(p.fin*(1-dsc))}</td></tr>`:""}
    ${o.svc&&R.svc.fis?`<tr><td>${esc(P.svc.fisicoName)}</td><td class="n">${money(R.svc.fis)}</td></tr>`:""}
    <tr class="T"><td>Total mensual</td><td class="n">${money((o.svc?R.svc.final+R.svc.fis:0)+(o.fin?p.fin*(1-dsc):0))}</td></tr></tbody></table>`;
   s += `<div class="ds"><h3>${o.fin&&o.svc?"Esquema mensual · monitoreo y financiación":o.fin?"Alternativas de financiación":"Servicio mensual de monitoreo"}</h3><div class="two">${col(R.planA)}${o.fin?col(R.planB):""}</div>
   <p class="small" style="margin-top:6px">${o.fin?`Valor financiado ${money(R.finBase)} a una tasa de ${num(P.fin.rate)} % mensual${R.planB.noInt?" (alternativa de "+R.planB.n+" cuotas sin interés)":""}. El IVA de las cuotas y del monitoreo se liquida sobre una base gravable del ${num(P.fin.aiu)} %. La financiación cubre equipos, materiales e instalación; no incluye el servicio mensual ni mantenimientos anuales. `:""}${o.svc?`Monitoreo para ${num(P.units)} unidades a ${money(P.svc.tarifa)} por unidad, contrato de ${num(P.contract)} meses con incremento anual IPC + ${num(P.ipc)} %.`:""}</p></div>`;
  }
  if (o.ahorro && R.svc.bill){ const M = R.svc, hib = P.svc.mode==="hibrido";
   s += `<div class="ds"><h3>Esquema de ahorro frente a la facturación actual</h3><table class="dtb"><thead><tr><th>Escenario</th><th class="n">Valor mensual</th><th class="n">Ahorro mensual</th><th class="n">Ahorro %</th></tr></thead><tbody>
    <tr><td>Facturación actual</td><td class="n">${money(M.bill)}</td><td></td><td></td></tr>
    <tr><td>${hib?"Propuesta: portería virtual + equipos + servicio físico":"Propuesta: servicio + equipos"}</td><td class="n">${money(M.propEq)}</td><td class="n">${money(M.ahorroEq)}</td><td class="n">${pct(M.ahorroEqPct)}</td></tr>
    <tr><td>${hib?"Propuesta: solo servicios (virtual + físico)":"Propuesta: solo servicio"}</td><td class="n">${money(M.propSolo)}</td><td class="n">${money(M.ahorroSolo)}</td><td class="n">${pct(M.ahorroSoloPct)}</td></tr></tbody></table><p class="small" style="margin-top:6px">Valores mensuales antes de IVA.</p></div>`; }
 }
 if (o.equipos && R.lines.length){
  let rows = "";
  [...new Set(S.systems.concat(R.lines.map(x=>x.sys)))].forEach(sy=>{ const ls = R.lines.filter(x=>x.sys===sy); if (!ls.length) return;
   rows += `<tr class="g"><td colspan="${o.unit?6:5}">${esc(sy)}</td></tr>` + ls.map((x,k)=>`<tr><td>${k+1}</td><td><b>${esc(x.name)}</b>${x.lic?`<div class="small">${esc(x.why)}</div>`:x.spec?`<div class="small">${esc(x.spec.slice(0,110))}${x.spec.length>110?"…":""}</div>`:""}</td><td class="small">${esc(x.ref)}</td><td class="n">${num(x.qty)}</td>${o.unit?`<td class="n">${money(x.price)}</td>`:""}<td class="n">${money(x.saleT)}</td></tr>`).join("")
    + `<tr class="s"><td colspan="${o.unit?5:4}">Subtotal ${esc(sy)}</td><td class="n">${money(ls.reduce((a,x)=>a+x.saleT,0))}</td></tr>`; });
  s += `<div class="ds">${H("Relación de equipos propuestos")}<table class="dtb"><thead><tr><th>Ít.</th><th>Descripción</th><th>Referencia</th><th class="n">Cant.</th>${o.unit?`<th class="n">P. unitario</th>`:""}<th class="n">Total</th></tr></thead><tbody>${rows}<tr class="t"><td colspan="${o.unit?5:4}">Total equipos antes de IVA</td><td class="n">${money(R.eqSale)}</td></tr></tbody></table>
  ${R.autoLines.length?`<div class="box" style="margin-top:10px"><h3>Licenciamiento de las terminales</h3><p class="small" style="margin:0;color:#1E1C1D">${R.autoLines.map(x=>`<b>${num(x.qty)} × ${esc(x.name)}</b> (${money(x.price)} c/u): ${esc(x.why)}`).join("<br>")}<br>Las licencias son de pago único y quedan asociadas al proyecto.</p></div>`:""}</div>`;
 }

 delCat(d){ const c = S.catalog[+d.i]; if (Object.values(S.projects).some(p=>p.lines.some(l=>l.cat===c.id))) { toast("Está en uso en una cotización: quítelo primero"); return "noop"; } S.catalog.splice(+d.i,1); },
 addMat(){ S.materials.push({grp:"Consumibles de obra", id:uid("m"), name:"Nuevo material", un:"UN", cost:0, res:"acc", inst:"", len:0, pack:0}); toast("Material agregado al final de la lista"); },
 delMat(d){ const m = S.materials[+d.i]; const used = S.profiles.some(p=>p.mats.some(r=>r.m===m.id)) || Object.values(S.tubeKits).some(ks=>ks.some(k=>k.m===m.id)) || Object.values(S.tubeSizes).some(z=>Object.values(z).includes(m.id)) || Object.values(S.tubeFix).includes(m.id) || S.derived.some(r=>r.m===m.id||r.src===m.id); if (used) { toast("Se usa en una regla: quítelo de las reglas primero"); return "noop"; } S.materials.splice(+d.i,1); },
 clearImg(d){ S.brand[d.k] = ""; },
 resetBrand(){ arm("btnResetBrand", ()=>{ S.brand = clone(DEF_BRAND); S.texts = clone(DEF_TEXTS); commit(); toast("Marca restaurada"); }); return "noop"; }
};
function nextNum(){ const y = new Date().getFullYear(); const n = Object.values(S.projects).map(p=>+(String(p.num).match(/(\d+)$/)||[0,0])[1]).reduce((a,b)=>Math.max(a,b),0)+1; return "COT-"+y+"-"+String(n).padStart(3,"0"); }
function download(text, name, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500); toast("Archivo generado: "+name); }

let rT;
function commit(){ dirty.cfg = true; if (S.active) dirty.proj.add(S.active); save(); clearTimeout(rT); rT = setTimeout(()=>{ const a = document.activeElement, id = a && a.id; let ss=null, se=null; try { ss = a.selectionStart; se = a.selectionEnd; } catch(e){}
 const y = window.scrollY; render(); window.scrollTo(0,y); if (id){ const n = document.getElementById(id); if (n){ n.focus({preventScroll:true}); try { if (ss!=null) n.setSelectionRange(ss,se); } catch(e){} } } }, 0); }

document.addEventListener("change", e=>{
 const el = e.target;
 if (el.id==="projSel"){ S.active = el.value; commit(); return; }
 if (el.id==="projF"){ V._pf = el.value; render(); return; }
 if (el.dataset.lict){ const [i,k] = el.dataset.lict.split("|"); if (el.value){ (S.licRules[+i][k] ||= []).push(el.value); commit(); } return; }
 if (el.dataset.status){ const P = proj(); if (P.status !== el.value){ P.status = el.value; P.updated = Date.now(); if (el.value==="aprobada") P.approvedAt = Date.now(); if (el.value!=="perdida"){} (P.log = P.log||[]).unshift({at:Date.now(), text:"Estado cambiado a "+stInfo(el.value)[1]}); snapshot(P, "Estado: "+stInfo(el.value)[1], true); commit(); toast("Estado actualizado y versión guardada"); } return; }
 if (el.dataset.actOff){ const P = proj(); if (el.checked) delete P.moff[el.dataset.actOff]; else P.moff[el.dataset.actOff] = true; commit(); return; }
 if (el.dataset.img){ const f = el.files[0]; if (!f) return; readImg(f, el.dataset.img==="logo" ? 700 : 1400, el.dataset.img==="logo").then(url=>{ S.brand[el.dataset.img] = url; commit(); toast(el.dataset.img==="logo"?"Logo actualizado":"Portada actualizada"); }); return; }
 if (el.id==="fileImport"){ const f = el.files[0]; if (!f) return; f.text().then(t=>{ try { const d = JSON.parse(t); if (d.projects && d.catalog){ S = d; upgrade(S); if (DISK.ok) syncDisk(true); } else if (d.lines){ d.id = uid("p"); S.projects[d.id] = d; S.active = d.id; upgrade(S); } else throw 0; commit(); toast("Respaldo importado"); } catch(x){ toast("El archivo no es un respaldo válido del cotizador"); } el.value=""; }); return; }
 const p = el.dataset.p; if (!p) return;
 const t = el.dataset.t; let v;
 if (t==="b") v = el.checked;
 else if (t==="n"){ if (el.value==="" && el.dataset.null) v = undefined; else v = parseFloat(String(el.value).replace(",", ".")) || 0; }
 else if (t==="lines") v = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
 else v = el.value;
 if (/\.profile$/.test(p) && p.startsWith("P.lines") && v==="") v = undefined;
 const pm = p.match(/^S\.profiles\.(\d+)/); if (pm) V._open = S.profiles[+pm[1]].id;
 setPath(p, v); if (p.startsWith("P.")) proj().updated = Date.now(); commit();
});
document.addEventListener("input", e=>{ if (e.target.id==="projQ"){ V._pq = e.target.value; clearTimeout(V._qt); V._qt = setTimeout(()=>{ render(); const n=$("#projQ"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }, 220); return; } if (e.target.id==="catQ"){ V._q = e.target.value; clearTimeout(V._qt); V._qt = setTimeout(()=>{ render(); const n=$("#catQ"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }, 220); } });
document.addEventListener("click", e=>{
 const g = e.target.closest("[data-go]"); if (g){ e.preventDefault(); VIEW = g.dataset.go; try { localStorage.setItem(STORE_KEY+"_view", VIEW); } catch(x){} render(); window.scrollTo(0,0); return; }
 const b = e.target.closest("[data-act]"); if (!b) return;
 const fn = A[b.dataset.act]; if (!fn) return; e.preventDefault();
 const r = fn(b.dataset); if (r!=="noop") commit();
});
document.addEventListener("keydown", e=>{ if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); if (document.activeElement) document.activeElement.blur(); setTimeout(()=>{ A.saveProj(); }, 30); } });
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden" && S) writeNow(); });
window.addEventListener("pagehide", ()=>{ if (S) writeNow(); });
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); V._install = e; if (VIEW==="proyectos") render(); });
if (/^https?:/.test(location.protocol) && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("toggle", e=>{ const d = e.target; if (d.matches && d.matches("details.prof")) { if (d.open) V._open = d.dataset.prof; else if (V._open===d.dataset.prof) V._open = null; } }, true);
function readImg(file, max, keepAlpha){
 return new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=>{ const im = new Image(); im.onload = ()=>{ const k = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); const x = c.getContext("2d"); if (!keepAlpha){ x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); } x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL(keepAlpha?"image/png":"image/jpeg", 0.85)); }; im.onerror = ()=>res(fr.result); im.src = fr.result; }; fr.readAsDataURL(file); });
}
function fitPreview(){ const w = $("#pvw"), d = $("#pv .doc"); if (!w || !d) return; const k = Math.min(1, (w.clientWidth-40)/816); d.style.transform = k<1?`scale(${k})`:""; $("#pv").style.height = k<1 ? (d.scrollHeight*k)+"px" : ""; $("#pv").style.width = (816*k)+"px"; }
new MutationObserver(fitPreview).observe(document.getElementById("view"), {childList:true});
window.addEventListener("resize", fitPreview);

load().then(()=>{ render(); renderDiskBadge(); });
</script>
